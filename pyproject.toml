[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["custom_components", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
stubPath = "tests/typings"

[tool.coverage.run]
branch = true
source = ["custom_components.heat_pump_schedule"]

[tool.coverage.report]
show_missing = true
skip_covered = true
